# Nginxに「ブラウザからアクセスが来たとき、どのように処理するか」を指示する設定ファイル

# Webサーバーの基本設定
server {
    listen 80;   # Nginxが80番ポートでアクセスを受け付けるという意味。例えば、ブラウザで次のURLにアクセスしたとする。ポート番号とは、コンピューターが通信を受け付ける窓口を識別するための番号。HTTP通信の標準ポートが80だから、ここでは80にしている。http://localhost/。HTTPでは、ポート番号を省略した場合、通常は80番ポートが使われる。
    server_name _;   # このNginxの設定が受け付けるホスト名を指定する設定。今回は _ という値を指定している。Nginxでは慣習的に、特定のホスト名を指定しないサーバー設定で使われることがある。

    root /usr/share/nginx/html;   # ブラウザに返すファイルを探すときの基本フォルダを指定する設定。Nginxがファイルを探す基本フォルダを /usr/share/nginx/html にするという意味。
    index index.html;    # URLでファイル名が指定されていない場合に、最初に表示するファイルを指定する設定。例えば、ブラウザで次のURLにアクセスしたとする、http://localhost/。ファイル名は指定されていない。その場合、Nginxは基本フォルダの中から index.html を探して返す。今回なら、/usr/share/nginx/html/index.htmlが対象になる。これはReactをビルドしたときに生成されたファイル。


    # location は、リクエストされたURLのパスに応じて、Nginxの処理を指定する設定。URLのパスが /api/ に該当するリクエストが来たら、指定したバックエンドに転送する。
    location /api/ {    # URLのパスが /api/ で始まるアクセスに対して、ここに書かれた設定を適用するという意味。http://localhost/api/notes/。http://localhost/api/register/。

        proxy_pass http://backend:8000;    # proxy_pass は、受け取ったアクセスを別のサーバーに転送する設定。つまり、Nginxが /api/ へのアクセスを受け取ったら、Djangoが動いている backend の8000番ポートに転送する。backend：Docker Composeで指定しているDjangoコンテナのサービス名。8000：Djangoが待ち受けているポート番号。

        # proxy_set_header はNginxからDjangoに転送するリクエストに、追加情報を付ける設定。
        proxy_set_header Host $host;    # アクセスされたホスト名をDjangoに渡す。例えば、ユーザーが example.com にアクセスしたなら、Djangoにも example.com という情報を渡す。
        proxy_set_header X-Real-IP $remote_addr;   # Nginxから見た接続元のIPアドレスをDjangoに渡す。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # アクセスがどのIPアドレスを経由してきたのかを記録するための情報を渡す。
        proxy_set_header X-Forwarded-Proto $scheme;    # Nginxが受け取ったときの通信方式をDjangoに渡す。例えば、HTTPなら http、HTTPSなら httpsという情報になる。
    }

    # Django admin  Djangoの管理画面にアクセスを転送
    location /admin/ {    # URLが /admin/ で始まるリクエストを処理する設定。
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files  Djangoの静的ファイルを配信。Djangoが用意したCSSやJavaScriptなどの静的ファイルを、Nginxからブラウザに渡すための設定。staticは開発者が用意したファイル。
    location /static/ {    # URLが /static/ で始まるリクエストを処理するという意味。例えばブラウザが、http://localhost/static/admin/css/base.cssというファイルを要求したとする。Nginxは、そのファイルを次の場所から探す。/usr/share/nginx/html/static/admin/css/base.css
        alias /usr/share/nginx/html/static/;     # リクエストされたURLに対応するファイルを、どのフォルダから探すかを指定している。
    }

    # Uploaded media  ユーザーがアップロードした画像などを扱うための設定。/media/ から始まる画像などへのリクエストをDjangoに転送する。mediaはユーザーがアップロードしたファイル。
    location /media/ {    # URLが /media/ で始まるリクエストを処理する設定。
        alias /usr/share/nginx/html/media/;
        # proxy_pass http://backend:8000;
        # proxy_set_header Host $host;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React SPA routing   Reactの画面を表示。Reactで作った画面にアクセスできるようにするための設定。
    location / {   # URLが / で始まるリクエストを処理する設定。/notes/、/api/notes/、/assets/style.cssなど。/api/ や /admin/ など、より具体的な location があれば、そちらの設定が優先される。/api/は、上で設定してるからそっちが優先される。
        try_files $uri $uri/ /index.html;    # 最初の2つが見つからなかった場合、Reactの index.html を返す。
    }
}
